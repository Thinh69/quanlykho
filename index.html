<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý vị trí kho</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#111827;color:#fff;padding:18px 20px}header h1{margin:0;font-size:22px}
main{max-width:950px;margin:auto;padding:18px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
label{font-weight:700;display:block;margin:10px 0 6px}input,select,button{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;font-size:16px}
button{background:#111827;color:#fff;border:0;font-weight:700;cursor:pointer;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.result{font-size:18px;padding:14px;background:#f0fdf4;border-radius:10px;margin-top:12px}.status{padding:10px;border-radius:9px;background:#f8fafc;margin-top:10px}.small{color:#64748b;font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}th{background:#f8fafc}.empty{text-align:center;color:#64748b;padding:20px}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}table{font-size:13px}}
</style></head><body>
<header><h1>📦 Quản lý vị trí hàng trong kho</h1></header><main>
<div class="card"><h2>☁️ Database online</h2><div class="status" id="dbStatus">Đang kiểm tra...</div>
<div class="small">Sau khi cấu hình Supabase, mọi điện thoại/máy tính sẽ dùng chung dữ liệu.</div></div>
<div class="card"><h2>🔎 Tìm hàng</h2><input id="search" placeholder="Nhập mã hàng..." oninput="searchItem()">
<div id="results" class="empty">Nhập mã hàng để tìm vị trí</div></div>
<div class="card"><h2>➕ Ghi vị trí hàng</h2><label>Mã hàng</label><input id="code" placeholder="VD: SP-001">
<div class="grid"><div><label>Kệ</label><select id="rack"></select></div><div><label>Tầng</label><select id="level"></select></div><div><label>Slot</label><select id="slot"></select></div></div>
<label>Số lượng (tùy chọn)</label><input id="qty" type="number" min="0" placeholder="VD: 20"><button onclick="saveItem()">💾 Lưu lên database</button></div>
<div class="card"><h2>📋 Hàng đã lưu</h2><div id="count" class="small"></div><div id="table"></div></div>
</main>
<script>
const SUPABASE_URL="https://klkfyhwehbwawxqhflix.supabase.co",SUPABASE_KEY="sb_publishable_gh0VwqKsJfAR9uYsS4OFIQ_CXAqUuSg";
const racks=['A','B','C','D','F','G','H','J','K'],data={};
const rack=document.getElementById('rack'),level=document.getElementById('level'),slot=document.getElementById('slot');
racks.forEach(x=>rack.add(new Option(x,x)));for(let i=1;i<=4;i++)level.add(new Option(i,i));for(let i=1;i<=26;i++)slot.add(new Option(String(i).padStart(2,'0'),i));
function configured(){return SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('DAN_')&&!SUPABASE_KEY.includes('DAN_')}
function headers(){return{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'}}
async function api(path,opt={}){let r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...opt,headers:{...headers(),...(opt.headers||{})}}),t=await r.text();if(!r.ok)throw Error(t||'HTTP '+r.status);return t?JSON.parse(t):null}
async function loadData(){if(!configured()){dbStatus.innerHTML='⚠️ Chưa cấu hình Supabase.';render();return}try{let rows=await api('warehouse_items?select=*&order=created_at.desc');Object.keys(data).forEach(k=>delete data[k]);rows.forEach(r=>(data[r.code]??=[]).push({id:r.id,pos:r.position,qty:r.quantity}));dbStatus.innerHTML='🟢 <b>Đã kết nối database online</b>';render()}catch(e){dbStatus.innerHTML='🔴 Lỗi kết nối: '+esc(e.message);render()}}
async function saveItem(){let code=document.getElementById('code').value.trim();if(!code)return alert('Nhập mã hàng trước nhé bro!');let pos=`${rack.value}-${level.value}-${String(slot.value).padStart(2,'0')}`,qty=document.getElementById('qty').value?Number(document.getElementById('qty').value):null;if(!configured())return alert('Chưa cấu hình Supabase.');try{await api('warehouse_items',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({code,position:pos,quantity:qty})});document.getElementById('code').value='';document.getElementById('qty').value='';await loadData();alert(`Đã lưu ${code} → ${pos}`)}catch(e){alert('Lưu thất bại: '+e.message)}}
function searchItem(){let q=document.getElementById('search').value.trim().toLowerCase(),b=document.getElementById('results');if(!q){b.className='empty';b.innerHTML='Nhập mã hàng để tìm vị trí';return}let keys=Object.keys(data).filter(k=>k.toLowerCase().includes(q));if(!keys.length){b.className='empty';b.innerHTML='Không tìm thấy mã hàng';return}b.className='result';b.innerHTML=keys.map(k=>`<b>${esc(k)}</b><br>`+data[k].map(x=>`📍 <b>${x.pos}</b>${x.qty!=null?' — '+x.qty+' cái':''}`).join('<br>')).join('<hr>')}
function render(){let rows=Object.entries(data).flatMap(([c,a])=>a.map(x=>`<tr><td>${esc(c)}</td><td><b>${x.pos}</b></td><td>${x.qty??''}</td><td><button onclick="removeItem('${x.id}')">Xóa</button></td></tr>`));count.textContent=`${rows.length} vị trí đã lưu`;table.innerHTML=rows.length?`<table><tr><th>Mã hàng</th><th>Vị trí</th><th>SL</th><th></th></tr>${rows.join('')}</table>`:'<div class="empty">Chưa có dữ liệu</div>'}
async function removeItem(id){if(!confirm('Xóa vị trí này?'))return;try{await api('warehouse_items?id=eq.'+encodeURIComponent(id),{method:'DELETE'});await loadData();searchItem()}catch(e){alert('Xóa thất bại: '+e.message)}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
loadData();
</script></body></html>
