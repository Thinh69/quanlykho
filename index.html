<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản lý vị trí kho</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#17202a
}

header{
    background:#111827;
    color:#fff;
    padding:18px 20px
}

header h1{
    margin:0;
    font-size:22px
}

main{
    max-width:950px;
    margin:auto;
    padding:18px
}

.card{
    background:#fff;
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 2px 10px #0001
}

label{
    font-weight:700;
    display:block;
    margin:10px 0 6px
}

input,select,button{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px
}

button{
    background:#111827;
    color:#fff;
    border:0;
    font-weight:700;
    cursor:pointer;
    margin-top:12px
}

button:hover{
    opacity:.9
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px
}

.result{
    font-size:18px;
    padding:14px;
    background:#f0fdf4;
    border-radius:10px;
    margin-top:12px
}

.status{
    padding:10px;
    border-radius:9px;
    background:#f8fafc;
    margin-top:10px
}

.small{
    color:#64748b;
    font-size:13px
}

.note{
    color:#475569;
    font-size:14px;
    margin-top:5px
}

.location{
    margin:7px 0
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px
}

th,td{
    text-align:left;
    padding:10px;
    border-bottom:1px solid #eee
}

th{
    background:#f8fafc
}

.empty{
    text-align:center;
    color:#64748b;
    padding:20px
}

hr{
    border:0;
    border-top:1px solid #ddd;
    margin:15px 0
}

.delete-btn{
    background:#dc2626;
    margin-top:0
}

@media(max-width:600px){

    .grid{
        grid-template-columns:1fr 1fr
    }

    table{
        font-size:13px;
        display:block;
        overflow-x:auto
    }

    th,td{
        padding:8px;
        white-space:nowrap
    }
}
</style>
</head>

<body>

<header>
<h1>📦 Quản lý vị trí hàng trong kho</h1>
</header>

<main>

<!-- DATABASE -->

<div class="card">

<h2>☁️ Database online</h2>

<div class="status" id="dbStatus">
Đang kiểm tra...
</div>

<div class="small">
Mọi điện thoại/máy tính sẽ dùng chung dữ liệu.
</div>

</div>


<!-- TÌM HÀNG -->

<div class="card">

<h2>🔎 Tìm hàng</h2>

<input
id="search"
placeholder="Nhập mã hàng..."
oninput="searchItem()"
>

<div id="results" class="empty">
Nhập mã hàng để tìm vị trí
</div>

</div>


<!-- GHI VỊ TRÍ -->

<div class="card">

<h2>➕ Ghi vị trí hàng</h2>

<label>Mã hàng</label>

<input
id="code"
placeholder="VD: NVL-005"
>

<div class="grid">

<div>
<label>Kệ</label>
<select id="rack"></select>
</div>

<div>
<label>Tầng</label>
<select id="level"></select>
</div>

<div>
<label>Slot</label>
<select id="slot"></select>
</div>

</div>


<label>⚖️ Số lượng (kg)</label>

<input
id="qty"
type="number"
step="0.01"
min="0"
placeholder="VD: 20.5"
>


<label>📦 Còn bao nhiêu bao?</label>

<input
id="bags"
type="number"
min="0"
placeholder="VD: 5"
>


<label>📝 Note / Ghi chú</label>

<input
id="note"
type="text"
placeholder="VD: Hàng lỗi, để riêng..."
>


<button onclick="saveItem()">
💾 Lưu lên database
</button>

</div>


<!-- DANH SÁCH -->

<div class="card">

<h2>📋 Hàng đã lưu</h2>

<div id="count" class="small"></div>

<div id="table"></div>

</div>

</main>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://klkfyhwehbwawxqhflix.supabase.co";

const SUPABASE_KEY =
"sb_publishable_gh0VwqKsJfAR9uYsS4OFIQ_CXAqUuSg";


/* ================================
   KỆ
================================ */

const racks=[
    'A',
    'B',
    'C',
    'D',
    'F',
    'G',
    'H',
    'J',
    'K'
];

const data={};

const rack=document.getElementById('rack');
const level=document.getElementById('level');
const slot=document.getElementById('slot');


racks.forEach(x=>{
    rack.add(new Option(x,x));
});


for(let i=1;i<=4;i++){
    level.add(new Option(i,i));
}


for(let i=1;i<=26;i++){
    slot.add(
        new Option(
            String(i).padStart(2,'0'),
            i
        )
    );
}


/* ================================
   DATABASE
================================ */

function configured(){

    return (
        SUPABASE_URL.startsWith('https://') &&
        !SUPABASE_URL.includes('DAN_') &&
        !SUPABASE_KEY.includes('DAN_')
    );

}


function headers(){

    return {
        apikey:SUPABASE_KEY,
        Authorization:'Bearer '+SUPABASE_KEY,
        'Content-Type':'application/json'
    };

}


async function api(path,opt={}){

    const r=await fetch(
        SUPABASE_URL+'/rest/v1/'+path,
        {
            ...opt,
            headers:{
                ...headers(),
                ...(opt.headers||{})
            }
        }
    );

    const t=await r.text();

    if(!r.ok){
        throw Error(
            t || 'HTTP '+r.status
        );
    }

    return t
        ?JSON.parse(t)
        :null;
}


/* ================================
   LOAD DATA
================================ */

async function loadData(){

    if(!configured()){

        dbStatus.innerHTML=
            '⚠️ Chưa cấu hình Supabase.';

        render();

        return;
    }


    try{

        const rows=
            await api(
                'warehouse_items?select=*&order=created_at.desc'
            );


        Object.keys(data).forEach(
            k=>delete data[k]
        );


        rows.forEach(r=>{

            if(!data[r.code]){
                data[r.code]=[];
            }


            data[r.code].push({

                id:r.id,

                pos:r.position,

                qty:r.quantity,

                bags:r.bags,

                note:r.note

            });

        });


        dbStatus.innerHTML=
            '🟢 <b>Đã kết nối database online</b>';


        render();


        if(
            document
            .getElementById('search')
            .value
            .trim()
        ){

            searchItem();

        }


    }catch(e){

        dbStatus.innerHTML=
            '🔴 Lỗi kết nối: '+
            esc(e.message);

        render();

    }

}


/* ================================
   LƯU HÀNG
================================ */

async function saveItem(){

    const code=
        document
        .getElementById('code')
        .value
        .trim();


    if(!code){

        alert(
            'Nhập mã hàng trước nhé bro!'
        );

        return;
    }


    const pos=
        `${rack.value}-${level.value}-${String(slot.value).padStart(2,'0')}`;


    const qtyValue=
        document
        .getElementById('qty')
        .value;


    const bagsValue=
        document
        .getElementById('bags')
        .value;


    const noteValue=
        document
        .getElementById('note')
        .value
        .trim();


    const qty=
        qtyValue !== ''
        ?Number(qtyValue)
        :null;


    const bags=
        bagsValue !== ''
        ?Number(bagsValue)
        :null;


    const note=
        noteValue !== ''
        ?noteValue
        :null;


    if(!configured()){

        alert(
            'Chưa cấu hình Supabase.'
        );

        return;
    }


    try{

        await api(
            'warehouse_items',
            {
                method:'POST',

                headers:{
                    Prefer:'return=minimal'
                },

                body:JSON.stringify({

                    code:code,

                    position:pos,

                    quantity:qty,

                    bags:bags,

                    note:note

                })
            }
        );


        document.getElementById('code').value='';
        document.getElementById('qty').value='';
        document.getElementById('bags').value='';
        document.getElementById('note').value='';


        await loadData();


        alert(
            `Đã lưu ${code} → ${pos}`
        );


    }catch(e){

        alert(
            'Lưu thất bại: '+
            e.message
        );

    }

}


/* ================================
   CHUẨN HÓA MÃ
================================ */

function normalizeCode(s){

    return String(s)
        .toUpperCase()
        .replace(/[^A-Z0-9]/g,'');

}


/* ================================
   ĐẢO CHUỖI
================================ */

function reverseString(s){

    return s
        .split('')
        .reverse()
        .join('');

}


/* ================================
   TÍNH ĐIỂM TƯƠNG ĐỒNG
================================ */

function similarityScore(query,code){

    if(query===code){
        return 10000;
    }


    if(code.includes(query)){
        return 9000 + query.length;
    }


    if(query.includes(code)){
        return 8000 + code.length;
    }


    /*
       Tìm các đoạn liên tiếp chung dài nhất.
    */

    let longest=0;


    for(
        let i=0;
        i<query.length;
        i++
    ){

        for(
            let j=i+1;
            j<=query.length;
            j++
        ){

            const part=
                query.substring(i,j);


            if(
                part.length>longest &&
                code.includes(part)
            ){

                longest=part.length;

            }

        }

    }


    /*
       Tìm số ký tự chung,
       không cần liên tiếp.
    */

    let common=0;


    for(
        const char of query
    ){

        if(code.includes(char)){
            common++;
        }

    }


    /*
       Điểm tổng hợp.
    */

    return (
        longest*100 +
        common*10
    );

}


/* ================================
   TÌM HÀNG
================================ */

function searchItem(){

    const input=
        document
        .getElementById('search')
        .value
        .trim();


    const result=
        document
        .getElementById('results');


    if(!input){

        result.className='empty';

        result.innerHTML=
            'Nhập mã hàng để tìm vị trí';

        return;

    }


    const query=
        normalizeCode(input);


    /*
       Tính điểm cho toàn bộ mã
    */

    let matches=
        Object.keys(data)
        .map(code=>{

            const normalized=
                normalizeCode(code);


            const score=
                similarityScore(
                    query,
                    normalized
                );


            return {

                key:code,

                score:score

            };

        });


    /*
       Nếu có kết quả chứa trực tiếp
       từ khóa thì ưu tiên chúng.
    */

    const direct=
        matches.filter(
            x=>x.score>=8000
        );


    if(direct.length){

        matches=direct;

    }


    /*
       Sắp xếp mã tốt nhất trước.
    */

    matches.sort(
        (a,b)=>
            b.score-a.score
    );


    /*
       Không có kết quả thực sự
    */

    if(!matches.length){

        result.className='empty';

        result.innerHTML=`
            Không có dữ liệu hàng.
            <br><br>
            <span class="small">
            Hãy thử nhập một phần mã.
            </span>
        `;

        return;

    }


    /*
       Hiện tối đa 15 mã
    */

    matches=
        matches.slice(0,15);


    result.className='result';


    result.innerHTML=
        matches
        .map(x=>{

            const code=x.key;


            const locations=
                data[code]
                .map(item=>{

                    let html=`
                        <div class="location">
                            📍 <b>
                            ${esc(item.pos)}
                            </b>
                    `;


                    if(
                        item.qty!==null &&
                        item.qty!==undefined
                    ){

                        html+=
                            ` — ${item.qty} kg`;

                    }


                    if(
                        item.bags!==null &&
                        item.bags!==undefined
                    ){

                        html+=
                            ` — 📦 ${item.bags} bao`;

                    }


                    html+=
                        '</div>';


                    if(item.note){

                        html+=`
                            <div class="note">
                                📝 ${esc(item.note)}
                            </div>
                        `;

                    }


                    return html;

                })
                .join('');


            return`
                <div>
                    <b>🔹 ${esc(code)}</b>
                    <br>
                    ${locations}
                </div>
            `;

        })
        .join('<hr>');

}


/* ================================
   HIỆN BẢNG
================================ */

function render(){

    const rows=
        Object.entries(data)
        .flatMap(
            ([code,items])=>

            items.map(item=>`

                <tr>

                    <td>
                        ${esc(code)}
                    </td>

                    <td>
                        <b>
                            ${esc(item.pos)}
                        </b>
                    </td>

                    <td>
                        ${item.qty != null ? item.qty + ' kg' : ''}
                    </td>

                    <td>
                        ${item.bags ?? ''}
                    </td>

                    <td>
                        ${
                            item.note
                            ?esc(item.note)
                            :''
                        }
                    </td>

                    <td>

                        <button
                            class="delete-btn"
                            onclick="removeItem('${item.id}')"
                        >
                            Xóa
                        </button>

                    </td>

                </tr>

            `)
        );


    document
        .getElementById('count')
        .textContent=
            `${rows.length} vị trí đã lưu`;


    document
        .getElementById('table')
        .innerHTML=

        rows.length

        ?

        `
        <table>

            <tr>

                <th>Mã hàng</th>

                <th>Vị trí</th>

                <th>SL (kg)</th>

                <th>📦 Bao</th>

                <th>📝 Note</th>

                <th></th>

            </tr>

            ${rows.join('')}

        </table>
        `

        :

        `
        <div class="empty">
            Chưa có dữ liệu
        </div>
        `;

}


/* ================================
   XÓA
================================ */

async function removeItem(id){

    if(
        !confirm(
            'Xóa vị trí này?'
        )
    ){

        return;

    }


    try{

        await api(

            'warehouse_items?id=eq.'+
            encodeURIComponent(id),

            {
                method:'DELETE'
            }

        );


        await loadData();

        searchItem();


    }catch(e){

        alert(
            'Xóa thất bại: '+
            e.message
        );

    }

}


/* ================================
   ESCAPE
================================ */

function esc(s){

    return String(s)
        .replace(
            /[&<>"']/g,

            m=>({

                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                '"':'&quot;',
                "'":'&#039;'

            }[m])
        );

}


/* ================================
   START
================================ */

loadData();

</script>

</body>
</html>
